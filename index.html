<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acompaña · Prototipo IA Humanizada</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="demo-banner">Prototipo de demostración: los datos, calificaciones y respuestas del asistente son simulados.</div>

<header class="topbar">
  <button type="button" class="logo-btn" data-go="home" aria-label="Ir al inicio">
    <img src="img/Logo.png" alt="Logo de Acompaña">
  </button>
  <button type="button" class="pill" data-go="home">Mi curso</button>
  <button type="button" class="icon-btn" id="btnCal" data-go="cal" aria-label="Calendario" title="Calendario">📅</button>
  <div class="search-wrap">
    <input type="search" id="hq" class="input" aria-label="Buscar en el curso" placeholder="Buscar en el curso (foro, actividad, examen…)">
  </div>
  <div class="role-wrap">
    <label for="role">Ver como</label>
    <select id="role" class="select">
      <option value="docente">Docente</option>
      <option value="evaluador">Evaluador</option>
      <option value="admin">Administrador</option>
    </select>
  </div>
</header>

<main id="app"></main>

<footer class="foot">
  Metadatos Dublin Core y LOM-CO · Licencias Creative Commons · Pensado para interoperar con otros repositorios (OAI-PMH)
</footer>

<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button type="button" class="modal-close" id="modalClose" aria-label="Cerrar">×</button>
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
